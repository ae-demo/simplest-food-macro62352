apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: macro-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  resources:
    - ref: simplest-food-mac-a6278402
      envBindings:
        dbname: MACRO_DB_DBNAME
        host: MACRO_DB_HOST
        password: MACRO_DB_PASSWORD
        port: MACRO_DB_PORT
        user: MACRO_DB_USER
    - ref: simplest-food-mac-20ff8e65
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
