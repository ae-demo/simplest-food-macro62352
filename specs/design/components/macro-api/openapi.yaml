openapi: 3.0.3
info:
  title: Macro Tracker API
  version: 0.1.0
servers:
  - url: /
security:
  - oauth2: []
paths:
  /me/food-entries:
    get:
      operationId: listMyFoodEntries
      summary: The caller's food entries
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
          description: filter to a single logged date (YYYY-MM-DD)
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      security:
        - oauth2: [food-entries:read]
      responses:
        '200':
          description: matching food entries
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FoodEntry' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyFoodEntry
      summary: Log a food entry for the caller
      security:
        - oauth2: [food-entries:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodEntryInput' }
      responses:
        '201':
          description: entry created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodEntry' }
        '400':
          description: invalid entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/food-entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateMyFoodEntry
      summary: Edit the caller's food entry
      security:
        - oauth2: [food-entries:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodEntryInput' }
      responses:
        '200':
          description: entry updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodEntry' }
        '404':
          description: no such entry for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteMyFoodEntry
      summary: Delete the caller's food entry
      security:
        - oauth2: [food-entries:write]
      responses:
        '204':
          description: entry deleted
        '404':
          description: no such entry for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/goal:
    get:
      operationId: getMyGoal
      summary: The caller's ongoing daily goal
      security:
        - oauth2: [daily-goal:read]
      responses:
        '200':
          description: current goal, or none set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyGoalOrNone' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: setMyGoal
      summary: Set or update the caller's ongoing daily goal
      security:
        - oauth2: [daily-goal:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyGoalInput' }
      responses:
        '200':
          description: goal saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyGoal' }
        '400':
          description: invalid goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/progress:
    get:
      operationId: getMyProgress
      summary: The caller's totals vs. goal for a day (default today)
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
          description: defaults to today when omitted
      security:
        - oauth2: [progress:read]
      responses:
        '200':
          description: totals, goal and remaining amounts for the day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressSummary' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/coach-access:
    get:
      operationId: listMyCoachAccess
      summary: Coaches the caller has granted access to
      security:
        - oauth2: [coach-access:manage]
      responses:
        '200':
          description: granted coaches
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CoachAccessGrant' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: grantCoachAccess
      summary: Grant a Coach (by email) access to the caller's log and goal
      security:
        - oauth2: [coach-access:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoachAccessInput' }
      responses:
        '201':
          description: access granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachAccessGrant' }
        '400':
          description: invalid coach email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/coach-access/{grantId}:
    parameters:
      - name: grantId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeCoachAccess
      summary: Revoke a Coach's access
      security:
        - oauth2: [coach-access:manage]
      responses:
        '204':
          description: access revoked
        '404':
          description: no such grant for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/clients:
    get:
      operationId: listMyGrantingClients
      summary: Clients who granted the caller (a Coach) access
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      security:
        - oauth2: [coach-access:read]
      responses:
        '200':
          description: clients who granted access to the caller
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClientSummary' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/clients/{clientId}/food-entries:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listGrantedClientFoodEntries
      summary: A granting client's food entries, read-only
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      security:
        - oauth2: [food-entries:read-granted]
      responses:
        '200':
          description: the client's food entries
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FoodEntry' }
        '404':
          description: no access granted by this client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/clients/{clientId}/goal:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGrantedClientGoal
      summary: A granting client's ongoing daily goal, read-only
      security:
        - oauth2: [daily-goal:read-granted]
      responses:
        '200':
          description: the client's current goal, or none set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyGoalOrNone' }
        '404':
          description: no access granted by this client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/clients/{clientId}/progress:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGrantedClientProgress
      summary: A granting client's totals vs. goal for a day, read-only
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
          description: defaults to today when omitted
      security:
        - oauth2: [progress:read-granted]
      responses:
        '200':
          description: the client's totals, goal and remaining amounts for the day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressSummary' }
        '404':
          description: no access granted by this client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            food-entries:read: The caller's own food entries
            food-entries:write: Create, edit and delete the caller's own food entries
            food-entries:read-granted: A granting client's food entries, read-only
            daily-goal:read: The caller's own daily goal
            daily-goal:write: Set or update the caller's own daily goal
            daily-goal:read-granted: A granting client's daily goal, read-only
            progress:read: The caller's own daily progress
            progress:read-granted: A granting client's daily progress, read-only
            coach-access:manage: Grant and revoke Coach access to the caller's data
            coach-access:read: List the clients who granted the caller (a Coach) access
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    FoodEntryInput:
      type: object
      required: [name, loggedDate, calories, proteinG, carbsG, fatG]
      properties:
        name: { type: string }
        loggedDate: { type: string, format: date }
        calories: { type: number }
        proteinG: { type: number }
        carbsG: { type: number }
        fatG: { type: number }
    FoodEntry:
      allOf:
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/FoodEntryInput'
    DailyGoalInput:
      type: object
      required: [calories, proteinG, carbsG, fatG]
      properties:
        calories: { type: number }
        proteinG: { type: number }
        carbsG: { type: number }
        fatG: { type: number }
    DailyGoal:
      allOf:
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: string }
            updatedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/DailyGoalInput'
    DailyGoalOrNone:
      type: object
      properties:
        goal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DailyGoal'
    ProgressSummary:
      type: object
      required: [date, consumed, remaining]
      properties:
        date: { type: string, format: date }
        goal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DailyGoalInput'
        consumed:
          type: object
          required: [calories, proteinG, carbsG, fatG]
          properties:
            calories: { type: number }
            proteinG: { type: number }
            carbsG: { type: number }
            fatG: { type: number }
        remaining:
          type: object
          nullable: true
          properties:
            calories: { type: number }
            proteinG: { type: number }
            carbsG: { type: number }
            fatG: { type: number }
    CoachAccessInput:
      type: object
      required: [coachEmail]
      properties:
        coachEmail: { type: string, format: email }
    CoachAccessGrant:
      type: object
      required: [id, coachEmail, grantedAt]
      properties:
        id: { type: string }
        coachEmail: { type: string, format: email }
        grantedAt: { type: string, format: date-time }
    ClientSummary:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
